[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tashevloop"
version = "0.2.0"
description = "Local-first learning loop for AI-assisted development."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Rinat Tashev"}]
keywords = ["ai", "vibe-coding", "developer-tools", "memory", "agents"]

[project.scripts]
tashevloop = "tashevloop.cli:main"
tashevloop-mcp = "tashevloop.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/tashev11/tashevloop"
Repository = "https://github.com/tashev11/tashevloop"
