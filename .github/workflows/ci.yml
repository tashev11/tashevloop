name: CI

# Manual-only for now. Local verification: python3 scripts/run_tests.py.
# Restore push/pull_request triggers once hosted runners are available.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: tashevloop doctor
