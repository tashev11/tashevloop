name: CI

# Temporarily manual-only because the repository owner account is currently
# blocked from starting GitHub-hosted runners by a GitHub billing lock.
# Local verification remains available and this workflow can be restored to
# push/pull_request triggers after the account issue is cleared.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: tashevloop doctor
